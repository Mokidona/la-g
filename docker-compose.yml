services:
  landing:
    build: .
    image: rehab-landing:latest
    container_name: rehab-landing
    restart: unless-stopped
    environment:
      # Задайте пароль админки при первом запуске. Если пусто — сервер
      # сгенерирует пароль и запишет его в /data/admin-password.txt.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      # Контент сайта, загруженные картинки и пароль админки.
      - landing-data:/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.rehab-landing.rule=Host(`kinesiolife.kz`)"
      - "traefik.http.routers.rehab-landing.entrypoints=websecure"
      - "traefik.http.routers.rehab-landing.tls.certresolver=myresolver"
      - "traefik.http.services.rehab-landing.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.35'
        reservations:
          memory: 64M

volumes:
  landing-data:

networks:
  traefik-public:
    external: true
